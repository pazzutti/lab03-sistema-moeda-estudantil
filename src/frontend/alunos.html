<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alunos - Moeda Estudantil</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/api.js"></script>
    <script>
      exigirLogin();
    </script>
  </head>
  <body>
    <header>
      <h1>Moeda Estudantil</h1>
      <nav id="menu"></nav>
    </header>

    <main>
      <section class="cartao">
        <h2>Alunos cadastrados</h2>
        <div id="mensagem" hidden></div>
        <div class="tabela">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>CPF</th>
                <th>Instituicao</th>
                <th>Curso</th>
                <th>Saldo</th>
              </tr>
            </thead>
            <tbody id="lista">
              <tr><td colspan="6" class="vazio">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const lista = document.getElementById('lista');

      api('/alunos')
        .then((alunos) => {
          if (alunos.length === 0) {
            lista.innerHTML =
              '<tr><td colspan="6" class="vazio">Nenhum aluno cadastrado</td></tr>';
            return;
          }
          const meuId = sessao.usuario?.tipo === 'ALUNO' ? sessao.usuario.id : null;
          lista.innerHTML = alunos
            .map(
              (a) => `
              <tr class="${a.id === meuId ? 'proprio' : ''}">
                <td>${escapar(a.nome)}</td>
                <td>${escapar(a.usuario.email)}</td>
                <td>${formatarCpf(a.cpf)}</td>
                <td>${escapar(a.instituicao.nome)}</td>
                <td>${escapar(a.curso)}</td>
                <td>${a.saldo}</td>
              </tr>`,
            )
            .join('');
        })
        .catch((erro) =>
          mostrarMensagem(document.getElementById('mensagem'), erro.message),
        );
    </script>
  </body>
</html>
