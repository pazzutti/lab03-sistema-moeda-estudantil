spring.application.name=moeda
# Para mostrar em cores no console
spring.output.ansi.enabled=ALWAYS

# Hibernate ddl auto (create, create-drop, update):
# "create": derruba as tabelas e cria novas
# "create-drop": elimina o banco e recria a cada reinício (tipicamente para testes)
# "update": compara o banco com o modelo de entidades e atualiza, sem apagar valores, tabelas ou colunas antigas
spring.jpa.hibernate.ddl-auto=create

# Para mostrar as cláusulas SQL no console enquanto testamos
spring.jpa.show-sql=true

server.port = 5000

# Spring Boot Devtools liga isso por padrao em dev; sem isso, respostas de erro
# (ex.: 403 do @PreAuthorize) vazam stack trace no corpo JSON.
server.error.include-stacktrace=never

# Configurações H2 (banco embarcado, em memória)
# Os dados vivem enquanto a aplicação estiver rodando; a cada reinício o banco
# começa vazio e o DataSeeder recria as contas de exemplo.
# Para persistir entre reinícios, troque por: jdbc:h2:file:./data/moeda
spring.datasource.url=jdbc:h2:mem:moeda;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2: http://localhost:5000/h2-console
# JDBC URL: jdbc:h2:mem:moeda | usuário: sa | senha: (vazia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
