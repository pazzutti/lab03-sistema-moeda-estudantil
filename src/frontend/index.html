<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar - Moeda Estudantil</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/api.js"></script>
  </head>
  <body>
    <header>
      <h1>Moeda Estudantil</h1>
      <nav id="menu"></nav>
    </header>

    <main>
      <section class="cartao estreito">
        <h2>Entrar</h2>
        <form id="form-login">
          <div id="mensagem" hidden></div>
          <label>
            Login
            <input name="login" required autocomplete="username" />
          </label>
          <label>
            Senha
            <input
              name="senha"
              type="password"
              required
              autocomplete="current-password"
            />
          </label>
          <button type="submit">Entrar</button>
        </form>
        <p>
          Ainda nao tem conta?
          <a href="cadastro-aluno.html">Cadastre-se como aluno</a> ou
          <a href="cadastro-empresa.html">como empresa parceira</a>.
        </p>
      </section>
    </main>

    <script>
      if (sessao.token) {
        window.location.href = 'alunos.html';
      }

      const form = document.getElementById('form-login');
      const mensagem = document.getElementById('mensagem');

      form.addEventListener('submit', async (evento) => {
        evento.preventDefault();
        const { login: usuario, senha } = lerFormulario(form);
        try {
          await login(usuario, senha);
          window.location.href =
            sessao.usuario.tipo === 'EMPRESA' ? 'empresas.html' : 'alunos.html';
        } catch (erro) {
          sessao.limpar();
          mostrarMensagem(mensagem, erro.message);
        }
      });
    </script>
  </body>
</html>
