<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de aluno - Moeda Estudantil</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/api.js"></script>
  </head>
  <body>
    <header>
      <h1>Moeda Estudantil</h1>
      <nav id="menu"></nav>
    </header>

    <main>
      <section class="cartao estreito">
        <h2>Cadastro de aluno</h2>
        <form id="form-aluno">
          <div id="mensagem" hidden></div>
          <label>Nome <input name="nome" required maxlength="120" /></label>
          <label>
            Email <input name="email" type="email" required maxlength="120" />
          </label>
          <label>
            CPF
            <input name="cpf" required placeholder="000.000.000-00" />
          </label>
          <label>RG <input name="rg" required maxlength="20" /></label>
          <label>
            Endereco <input name="endereco" required maxlength="255" />
          </label>
          <label>
            Instituicao de ensino
            <select name="instituicaoId" id="instituicao" required>
              <option value="">Carregando...</option>
            </select>
          </label>
          <label>Curso <input name="curso" required maxlength="120" /></label>
          <label>Login <input name="login" required maxlength="60" /></label>
          <label>
            Senha
            <input name="senha" type="password" required minlength="6" />
          </label>
          <button type="submit">Cadastrar</button>
        </form>
      </section>
    </main>

    <script>
      const form = document.getElementById('form-aluno');
      const mensagem = document.getElementById('mensagem');
      const selectInstituicao = document.getElementById('instituicao');

      // Instituicoes sao pre-cadastradas; o aluno apenas seleciona a sua.
      api('/instituicoes')
        .then((instituicoes) => {
          selectInstituicao.innerHTML =
            '<option value="">Selecione...</option>' +
            instituicoes
              .map((i) => `<option value="${i.id}">${escapar(i.nome)}</option>`)
              .join('');
        })
        .catch((erro) => mostrarMensagem(mensagem, erro.message));

      form.addEventListener('submit', async (evento) => {
        evento.preventDefault();
        const dados = lerFormulario(form);
        dados.instituicaoId = Number(dados.instituicaoId);
        try {
          await api('/alunos', { method: 'POST', body: dados });
          await login(dados.login, dados.senha);
          window.location.href = 'alunos.html';
        } catch (erro) {
          mostrarMensagem(mensagem, erro.message);
        }
      });
    </script>
  </body>
</html>
