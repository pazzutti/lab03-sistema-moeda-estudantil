<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu cadastro - Moeda Estudantil</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/api.js"></script>
    <script>
      exigirLogin();
    </script>
  </head>
  <body>
    <header>
      <h1>Moeda Estudantil</h1>
      <nav id="menu"></nav>
    </header>

    <main>
      <section class="cartao estreito">
        <h2>Meu cadastro</h2>
        <div id="mensagem" hidden></div>

        <!-- Login, CPF e CNPJ sao imutaveis: aparecem desabilitados. -->
        <form id="form-aluno" hidden>
          <label>Login <input id="aluno-login" disabled /></label>
          <label>CPF <input id="aluno-cpf" disabled /></label>
          <label>Nome <input name="nome" required maxlength="120" /></label>
          <label>
            Email <input name="email" type="email" required maxlength="120" />
          </label>
          <label>RG <input name="rg" required maxlength="20" /></label>
          <label>
            Endereco <input name="endereco" required maxlength="255" />
          </label>
          <label>
            Instituicao de ensino
            <select name="instituicaoId" id="instituicao" required></select>
          </label>
          <label>Curso <input name="curso" required maxlength="120" /></label>
          <label>
            Nova senha (deixe em branco para manter)
            <input name="senha" type="password" minlength="6" />
          </label>
          <div class="acoes">
            <button type="submit">Salvar</button>
            <button type="button" class="perigo" data-excluir>
              Excluir conta
            </button>
          </div>
        </form>

        <form id="form-empresa" hidden>
          <label>Login <input id="empresa-login" disabled /></label>
          <label>CNPJ <input id="empresa-cnpj" disabled /></label>
          <label>
            Nome da empresa <input name="nome" required maxlength="120" />
          </label>
          <label>
            Email <input name="email" type="email" required maxlength="120" />
          </label>
          <label>
            Nova senha (deixe em branco para manter)
            <input name="senha" type="password" minlength="6" />
          </label>
          <div class="acoes">
            <button type="submit">Salvar</button>
            <button type="button" class="perigo" data-excluir>
              Excluir conta
            </button>
          </div>
        </form>
      </section>
    </main>

    <script>
      const mensagem = document.getElementById('mensagem');
      const { id, tipo } = sessao.usuario ?? {};
      const ehAluno = tipo === 'ALUNO';
      const recurso = ehAluno ? `/alunos/${id}` : `/empresas/${id}`;
      const form = document.getElementById(ehAluno ? 'form-aluno' : 'form-empresa');

      function preencher(perfil) {
        for (const campo of ['nome', 'rg', 'endereco', 'curso']) {
          if (form.elements[campo]) form.elements[campo].value = perfil[campo];
        }
        form.elements.email.value = perfil.usuario.email;
        form.elements.senha.value = '';
        if (ehAluno) {
          document.getElementById('aluno-login').value = perfil.usuario.login;
          document.getElementById('aluno-cpf').value = formatarCpf(perfil.cpf);
          form.elements.instituicaoId.value = perfil.instituicao.id;
        } else {
          document.getElementById('empresa-login').value = perfil.usuario.login;
          document.getElementById('empresa-cnpj').value = formatarCnpj(perfil.cnpj);
        }
      }

      async function carregar() {
        if (tipo !== 'ALUNO' && tipo !== 'EMPRESA') {
          mostrarMensagem(mensagem, 'Edicao disponivel apenas para alunos e empresas.');
          return;
        }
        if (ehAluno) {
          const instituicoes = await api('/instituicoes');
          document.getElementById('instituicao').innerHTML = instituicoes
            .map((i) => `<option value="${i.id}">${escapar(i.nome)}</option>`)
            .join('');
        }
        preencher(await api(recurso));
        form.hidden = false;
      }

      form.addEventListener('submit', async (evento) => {
        evento.preventDefault();
        const dados = lerFormulario(form, { ignorarVazios: true });
        if (dados.instituicaoId) dados.instituicaoId = Number(dados.instituicaoId);
        try {
          preencher(await api(recurso, { method: 'PATCH', body: dados }));
          mostrarMensagem(mensagem, 'Cadastro atualizado.', 'sucesso');
        } catch (erro) {
          mostrarMensagem(mensagem, erro.message);
        }
      });

      form.querySelector('[data-excluir]').addEventListener('click', async () => {
        if (!confirm('Tem certeza que deseja excluir sua conta? Esta acao nao pode ser desfeita.')) {
          return;
        }
        try {
          await api(recurso, { method: 'DELETE' });
          logout();
        } catch (erro) {
          mostrarMensagem(mensagem, erro.message);
        }
      });

      carregar().catch((erro) => mostrarMensagem(mensagem, erro.message));
    </script>
  </body>
</html>
