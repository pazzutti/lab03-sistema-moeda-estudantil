<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Empresas parceiras - Moeda Estudantil</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/api.js"></script>
    <script>
      exigirLogin();
    </script>
  </head>
  <body>
    <header>
      <h1>Moeda Estudantil</h1>
      <nav id="menu"></nav>
    </header>

    <main>
      <section class="cartao">
        <h2>Empresas parceiras</h2>
        <div id="mensagem" hidden></div>
        <div class="tabela">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>CNPJ</th>
              </tr>
            </thead>
            <tbody id="lista">
              <tr><td colspan="3" class="vazio">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const lista = document.getElementById('lista');

      api('/empresas')
        .then((empresas) => {
          if (empresas.length === 0) {
            lista.innerHTML =
              '<tr><td colspan="3" class="vazio">Nenhuma empresa cadastrada</td></tr>';
            return;
          }
          const meuId =
            sessao.usuario?.tipo === 'EMPRESA' ? sessao.usuario.id : null;
          lista.innerHTML = empresas
            .map(
              (e) => `
              <tr class="${e.id === meuId ? 'proprio' : ''}">
                <td>${escapar(e.nome)}</td>
                <td>${escapar(e.usuario.email)}</td>
                <td>${formatarCnpj(e.cnpj)}</td>
              </tr>`,
            )
            .join('');
        })
        .catch((erro) =>
          mostrarMensagem(document.getElementById('mensagem'), erro.message),
        );
    </script>
  </body>
</html>
